name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  BORIS_REPOSITORY: https://github.com/drawmeanelephant/boris.git
  BORIS_BRANCH: afterparty

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout drawmeanelephant.com
        uses: actions/checkout@v4

      - name: Set up pinned Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Obtain Boris source (afterparty branch)
        run: |
          git clone --branch "$BORIS_BRANCH" --single-branch --depth=1 "$BORIS_REPOSITORY" "$RUNNER_TEMP/boris"

      - name: Cache Zig compiler directories
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            ${{ runner.temp }}/zig-local-cache
          key: ${{ runner.os }}-zig-${{ env.BORIS_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.BORIS_BRANCH }}-
            ${{ runner.os }}-zig-

      - name: Build pinned Boris
        working-directory: ${{ runner.temp }}/boris
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
        run: |
          zig build
          mkdir -p "${{ github.workspace }}/bin"
          cp zig-out/bin/boris "${{ github.workspace }}/bin/boris"
          chmod +x "${{ github.workspace }}/bin/boris"

      - name: Build static site output
        env:
          BORIS_BIN: ./bin/boris
          DIST_DIR: dist
        run: ./build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=drawmeanelephant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
